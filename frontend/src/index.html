<!doctype html>
<html lang="es-CL" class="dark">
<head>
  <meta charset="utf-8">
  <title>GymTracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f0c">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Fuentes de la app: se piden de inmediato (mientras se ve el splash) para que no se note el cambio de fuente. -->
  <link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-condensed-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTracker">
</head>
<body>
  <!-- Copia estática de BootSplash (shared/ui/boot-splash.ts): se anima mientras descarga la app; Angular la reemplaza al arrancar. -->
  <app-root>
    <div class="boot-splash" role="status" aria-busy="true">
      <div class="boot-tile">
        <svg class="boot-logo" viewBox="0 0 512 512" aria-hidden="true">
          <rect x="192" y="236" width="128" height="40" rx="8" />
          <rect class="boot-plate-inner boot-left" x="144" y="144" width="48" height="224" rx="14" />
          <rect class="boot-plate-inner boot-right" x="320" y="144" width="48" height="224" rx="14" />
          <rect class="boot-plate-outer boot-left" x="96" y="176" width="40" height="160" rx="12" />
          <rect class="boot-plate-outer boot-right" x="376" y="176" width="40" height="160" rx="12" />
        </svg>
      </div>
      <p class="boot-name">Gym Tracker</p>
      <p class="skeleton-hint boot-hint">Despertando el servidor…</p>
    </div>
  </app-root>
</body>
</html>
