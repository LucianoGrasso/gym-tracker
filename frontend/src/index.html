<!doctype html>
<html lang="es-CL" class="dark">
<head>
  <meta charset="utf-8">
  <title>GymTracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f0c">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTracker">
</head>
<body>
  <!-- Copia estática de BootSplash (shared/ui/boot-splash.ts): se anima mientras descarga la app; Angular la reemplaza al arrancar. -->
  <app-root>
    <div class="boot-splash" role="status" aria-busy="true">
      <svg class="boot-logo" viewBox="96 144 320 224" aria-hidden="true">
        <rect class="boot-plate-outer" x="96" y="176" width="40" height="160" rx="12" />
        <rect class="boot-plate-inner" x="144" y="144" width="48" height="224" rx="14" />
        <rect x="192" y="236" width="128" height="40" rx="8" />
        <rect class="boot-plate-inner" x="320" y="144" width="48" height="224" rx="14" />
        <rect class="boot-plate-outer" x="376" y="176" width="40" height="160" rx="12" />
      </svg>
      <p class="boot-name">GymTracker</p>
      <p class="skeleton-hint boot-hint">Despertando el servidor…</p>
    </div>
  </app-root>
</body>
</html>
